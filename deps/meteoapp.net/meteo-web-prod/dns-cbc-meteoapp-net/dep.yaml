notes: |
    This DNS zone is used for ACME verification for hostnames hosted by the Cirrus docker VMs. These VMs
    generate their own certificates, and can use DNS-01 acme verification for this. Therefore it is safer
    to use a dedicated DNS zone for ACME verification rather than use the `cb.meteoapp.net` zone.
