api:
  dashboard: true

log:
  level: DEBUG
  #filePath: /var/log/traefik.log

accessLog: {}
  #filePath: /var/log/traefik-access.log

providers:
  docker:
    network: proxy
    exposedByDefault: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        certResolver: myresolver

certificatesResolvers:
  myresolver:
    acme:
      tlsChallenge: {}
      storage: /letsencrypt/acme.json
