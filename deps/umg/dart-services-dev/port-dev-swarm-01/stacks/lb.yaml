version: '3.5'

services:
  traefik:
    image: traefik:1.7
    environment:
      GODEBUG: 'tls13=1'
    command:
      --docker=true
      --docker.swarmmode=true
      --docker.watch=true
      --docker.exposedbydefault=false
      --docker.domain=traefik
      --defaultentrypoints='http,https'
      --entrypoints='Name:http Address::80 Redirect.EntryPoint:https'
      --entrypoints='Name:https Address::443 TLS TLS.MinVersion:VersionTLS12 TLS.CipherSuites:TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305'
      --api=true
      --acme=true
      --acme.storage=/data/acme.json
      --acme.entryPoint=https
      --acme.httpChallenge.entryPoint=http
      --acme.email={{ACME_EMAIL}}
      --acme.onhostrule=true
      --acme.acmelogging=true
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_acme_dev:/data
    deploy:
      labels:
        - traefik.enable=true
        - traefik.frontend.rule=Host:{{HOSTNAME_CIRRUS_LB_SWARM}}
        - traefik.port=8080
        - traefik.frontend.entryPoints=http,https
        - traefik.frontend.auth.basic.users={{TRAEFIK_USER}}:{{TRAEFIK_PASSWORD}}
        - traefik.docker.network=web

volumes:
  traefik_acme:
  traefik_acme_dev:

networks:
  web:
    external: true
