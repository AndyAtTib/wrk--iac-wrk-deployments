services:
  traefik:
    image: traefik:v3.7
    ports:
      # every http host port lands on the web entrypoint (:80),
      # every https host port on the websecure entrypoint (:443)
      - "80:80"
      - "81:80"
      - "8080:80"
      - "9080:80"
      - "443:443"
      - "444:443"
      - "8443:443"
      - "9443:443"
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - letsencrypt:/letsencrypt
      #- /var/log:/var/log
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      #- --log.filepath=/var/log/traefik.log
      - --accesslog=true
      #- --accesslog.filepath=/var/log/traefik-access.log
      - --providers.docker.network=proxy
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      # no http->https redirect: plain http is routed to echo as-is so the
      # url-tests get a 200 (not a 308) and the echo shows the http request
      #- --entrypoints.web.http.redirections.entrypoint.to=websecure
      #- --entryPoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certresolver=myresolver
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.mydashboard.rule=Host(`traefik.example.com`)
      - traefik.http.routers.mydashboard.service=api@internal
      - traefik.http.routers.mydashboard.middlewares=myauth
      - traefik.http.middlewares.myauth.basicauth.users=test:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/

  echo:
    image: mendhak/http-https-echo
    restart: always
    # no host ports: traefik publishes them and reaches echo over the proxy
    # network on its plain-http listener (8080). echo's own https listener
    # (8443) is unused because tls terminates at traefik.
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # catch-all: answer for whatever host/ip the load balancers deliver, but means that the traefik cert will not be valid for all hosts
      - traefik.http.routers.echo.rule=PathPrefix(`/`)
      # web is plain http; websecure gets tls from the entrypoint default
      - traefik.http.routers.echo.entrypoints=web,websecure
      - traefik.http.services.echo.loadbalancer.server.port=8080
  # replaced with echo:
  # whoami:
  #   image: traefik/whoami:v1.11
  #   networks:
  #     - proxy
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.mywhoami.rule=Host(`whoami.example.com`) || Host(`www.whoami.example.com`)
  #     - traefik.http.services.mywhoami.loadbalancer.server.port=80

  #     # next lines are optional to redirect www to non-www
  #     - traefik.http.middlewares.mywwwredirect.redirectregex.regex=^https://www\.(.*)
  #     - traefik.http.middlewares.mywwwredirect.redirectregex.replacement=https://$${1}
  #     - traefik.http.routers.mywhoami.middlewares=mywwwredirect

networks:
  proxy:
    name: proxy

volumes:
  letsencrypt:
    name: letsencrypt
